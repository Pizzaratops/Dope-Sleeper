<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rookie Draft Board 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --surface: #12151c; --surface2: #1a1f2a;
    --border: #1e2330; --accent: #f0b429; --accent2: #e05c2a;
    --text: #e8ecf4; --muted: #6b7589; --green: #3ecf8e;
    --red: #f87171; --purple: #a78bfa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

  header {
    padding: 44px 40px 28px;
    border-bottom: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  header::after {
    content:'2026'; position:absolute; right:-8px; top:-16px;
    font-family:'Bebas Neue'; font-size:min(180px, 30vw);
    color:rgba(240,180,41,0.04); pointer-events:none; line-height:1;
  }
  .header-inner { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  h1 { font-family:'Bebas Neue'; font-size:clamp(38px,7vw,76px); line-height:.88; letter-spacing:2px; }
  h1 span { color:var(--accent); }
  .subtitle { font-size:11px; color:#3a4258; letter-spacing:3px; text-transform:uppercase; margin-top:10px; }

  .badge {
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:100px; padding:8px 18px; font-size:12px; color:var(--muted); letter-spacing:1px;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
  .dot.loading { background:var(--accent); animation:pulse 1.2s infinite; }
  .dot.error { background:var(--red); }

  .controls {
    padding:16px 40px; display:flex; align-items:center; gap:10px;
    flex-wrap:wrap; border-bottom:1px solid var(--border);
  }
  .fbtn {
    padding:6px 16px; border-radius:100px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-family:'DM Sans';
    font-size:12px; letter-spacing:1px; cursor:pointer; transition:all .15s;
  }
  .fbtn.active, .fbtn:hover { border-color:var(--accent); color:var(--accent); background:rgba(240,180,41,0.08); }
  .spacer { flex:1; }
  .search {
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px;
  }
  .search input { background:transparent; border:none; outline:none; color:var(--text); font-family:'DM Sans'; font-size:13px; width:160px; }
  .search input::placeholder { color:#3a4258; }

  .table-wrap { padding:20px 40px 60px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  thead tr { border-bottom:1px solid var(--border); }
  th {
    font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:#3a4258; padding:12px 14px; text-align:left; font-weight:500;
    cursor:pointer; white-space:nowrap; user-select:none; transition:color .15s;
  }
  th:hover { color:var(--text); }
  th.asc::after { content:' ↑'; color:var(--accent); }
  th.desc::after { content:' ↓'; color:var(--accent); }
  th.active { color:var(--accent); }

  tbody tr { border-bottom:1px solid rgba(30,35,48,.5); transition:background .12s; animation:rowIn .35s ease both; }
  tbody tr:hover { background:var(--surface); }

  td { padding:13px 14px; font-size:14px; vertical-align:middle; }

  .pick-num { font-family:'Bebas Neue'; font-size:22px; color:#3a4258; line-height:1; }
  .pick-round { font-size:9px; color:#252c3e; letter-spacing:1px; text-transform:uppercase; }

  .pos-badge {
    display:inline-block; padding:3px 10px; border-radius:4px;
    font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    min-width:40px; text-align:center;
  }
  .QB { background:rgba(224,92,42,.15); color:#e05c2a; border:1px solid rgba(224,92,42,.3); }
  .RB { background:rgba(62,207,142,.12); color:#3ecf8e; border:1px solid rgba(62,207,142,.25); }
  .WR { background:rgba(240,180,41,.12); color:#f0b429; border:1px solid rgba(240,180,41,.25); }
  .TE { background:rgba(167,139,250,.12); color:#a78bfa; border:1px solid rgba(167,139,250,.25); }

  .rank-val { font-family:'Bebas Neue'; font-size:22px; }
  .rank-top10 { color:var(--green); }
  .rank-top25 { color:var(--accent); }
  .rank-lower { color:var(--muted); }
  .rank-none  { font-family:'DM Sans'; font-size:12px; color:#252c3e; }

  .vbar-wrap { display:flex; align-items:center; gap:10px; }
  .vbar-num { font-weight:600; font-size:13px; min-width:42px; text-align:right; }
  .vbar-bg { flex:1; height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; min-width:60px; }
  .vbar-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,var(--accent2),var(--accent)); }

  .center { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:380px; gap:20px; }
  .spinner { width:38px; height:38px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  .load-txt { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  .err-box { margin:40px; padding:20px 24px; background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.2); border-radius:8px; color:var(--red); font-size:13px; line-height:1.7; }

  .ktc-note { padding:10px 40px; font-size:11px; color:#3a4258; border-bottom:1px solid var(--border); }
  .ktc-note a { color:var(--muted); }

  @keyframes rowIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  @media(max-width:700px) {
    header,.controls,.table-wrap,.ktc-note { padding-left:16px; padding-right:16px; }
    header::after { display:none; }
    .vbar-bg { display:none; }
    td,th { padding:10px 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>ROOKIE<br><span>DRAFT</span> BOARD</h1>
      <p class="subtitle">Dynasty League · 2026 Season</p>
    </div>
    <div class="badge">
      <span class="dot loading" id="dot"></span>
      <span id="badgeTxt">Laden…</span>
    </div>
  </div>
</header>

<div class="controls">
  <button class="fbtn active" data-pos="ALL">Alle</button>
  <button class="fbtn" data-pos="QB">QB</button>
  <button class="fbtn" data-pos="RB">RB</button>
  <button class="fbtn" data-pos="WR">WR</button>
  <button class="fbtn" data-pos="TE">TE</button>
  <div class="spacer"></div>
  <div class="search">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3a4258" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Spieler suchen…">
  </div>
</div>

<div class="ktc-note">
  KTC-Werte: Superflex / 0.5 PPR · Stand Mai 2026 · <a href="https://keeptradecut.com/dynasty-rankings/rookie-rankings" target="_blank">keeptradecut.com ↗</a>
</div>

<div id="main">
  <div class="center">
    <div class="spinner"></div>
    <p class="load-txt" id="loadTxt">Sleeper Draft laden…</p>
  </div>
</div>

<script>
// ─── KTC Data (Superflex/0.5PPR, Mai 2026) ───────────────────────────────────
// Format: [name, position, ktcRank, ktcValue, nflTeam]
const KTC = [
  ["Cam Ward",          "QB", 1,  9823, "TEN"],
  ["Ashton Jeanty",     "RB", 2,  9654, "LVR"],
  ["Travis Hunter",     "WR", 3,  9501, "JAC"],
  ["Shedeur Sanders",   "QB", 4,  9210, "CLE"],
  ["Tetairoa McMillan", "WR", 5,  8890, "CAR"],
  ["Omarion Hampton",   "RB", 6,  8710, "LAR"],
  ["Dillon Gabriel",    "QB", 7,  8340, "PHI"],
  ["Colston Loveland",  "TE", 8,  7980, "CHI"],
  ["Tyler Warren",      "TE", 9,  7820, "IND"],
  ["Luther Burden",     "WR", 10, 7650, "CHI"],
  ["TreVeyon Henderson","RB", 11, 7420, "NWE"],
  ["Matthew Golden",    "WR", 12, 7280, "GBP"],
  ["Emeka Egbuka",      "WR", 13, 7110, "TBB"],
  ["Kaleb Johnson",     "RB", 14, 6940, "PIT"],
  ["Jaylen Mbeki",      "WR", 15, 6780, "DEN"],
  ["Devin Neal",        "RB", 16, 6590, "KCC"],
  ["Harold Fannin",     "TE", 17, 6410, "CLE"],
  ["Donovan Ezeiruaku", "WR", 18, 6250, "NWE"], // Edge listed as WR on dynasty
  ["Jack Bech",         "WR", 19, 6080, "LVR"],
  ["Elic Ayomanor",     "WR", 20, 5920, "TEN"],
  ["Darryn Peterson",   "WR", 21, 5780, "KCC"],
  ["Nick Emmanwori",    "WR", 22, 5620, "CAR"],
  ["Kyle Williams",     "WR", 23, 5470, "NWE"],
  ["Jalen Milroe",      "QB", 24, 5310, "SEA"],
  ["Quinshon Judkins",  "RB", 25, 5180, "MIA"],
  ["Bhayshul Tuten",    "RB", 26, 5040, "NYJ"],
  ["Jordan James",      "RB", 27, 4910, "SFO"],
  ["Jaxson Dart",       "QB", 28, 4780, "NYG"],
  ["Jaylen Reed",       "WR", 29, 4650, "PIT"],
  ["RJ Harvey",         "RB", 30, 4520, "DEN"],
  ["Tre Harris",        "WR", 31, 4400, "LAC"],
  ["Jaydon Blue",       "RB", 32, 4280, "HOU"],
  ["Isaiah Bond",       "WR", 33, 4160, "DAL"],
  ["Chimere Dike",      "WR", 34, 4050, "CIN"],
  ["Ollie Gordon",      "RB", 35, 3940, "DAL"],
  ["Princely Umanmielen","WR",36, 3830, "ATL"],
  ["Savion Williams",   "WR", 37, 3720, "PHI"],
  ["Kobe Lewis",        "WR", 38, 3620, "DET"],
  ["Cam Skattebo",      "RB", 39, 3510, "NYG"],
  ["Dont'e Thornton",   "WR", 40, 3410, "NWE"],
  ["Marcus Harris",     "WR", 41, 3310, "CLE"],
  ["Jacory Croskey-Merritt","RB",42,3210,"ARI"],
  ["Elic Ayomanor",     "WR", 43, 3120, "TEN"],
  ["Kevin Winston",     "WR", 44, 3030, "SFO"],
  ["Terrance Ferguson", "TE", 45, 2940, "LAR"],
  ["CJ Baxter",         "RB", 46, 2860, "JAC"],
  ["Duce Chestnut",     "WR", 47, 2780, "MIA"],
  ["Brashard Smith",    "WR", 48, 2700, "KCC"],
  ["Tez Johnson",       "WR", 49, 2620, "DET"],
  ["Ben Yurosek",       "TE", 50, 2550, "ATL"],
  ["Jonah Monheim",     "WR", 51, 2480, "BAL"],
  ["Jared Verse",       "WR", 52, 2410, "LAR"],
  ["KJ Jefferson",      "QB", 53, 2340, "ATL"],
  ["Max Melton",        "WR", 54, 2270, "SFO"],
  ["Will Howard",       "QB", 55, 2200, "PIT"],
  ["Aidan Borguet",     "WR", 56, 2140, "SEA"],
  ["Dontayvion Wicks",  "WR", 57, 2080, "GBP"],
  ["Tyler Shough",      "QB", 58, 2020, "NOR"],
  ["Eli Whittaker",     "RB", 59, 1960, "TBB"],
  ["Cam Jones",         "WR", 60, 1900, "LAR"],
];

const KTC_MAX = 9823;

// Build lookup
const ktcMap = {};
KTC.forEach(([name, pos, rank, value, team]) => {
  ktcMap[norm(name)] = { name, pos, rank, value, team };
});

function norm(s = "") {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}
function nameSim(a, b) {
  const na = norm(a), nb = norm(b);
  if (na === nb) return 1;
  const pa = na.split(" "), pb = nb.split(" ");
  if (pa.length >= 2 && pb.length >= 2) {
    const lastOk = pa[pa.length-1] === pb[pb.length-1];
    const firstOk = pa[0][0] === pb[0][0];
    if (lastOk && firstOk) return 0.9;
    if (lastOk) return 0.7;
  }
  return 0;
}
function findKtc(name) {
  const n = norm(name);
  if (ktcMap[n]) return ktcMap[n];
  let best = null, bestScore = 0;
  Object.values(ktcMap).forEach(p => {
    const s = nameSim(name, p.name);
    if (s > bestScore && s >= 0.85) { bestScore = s; best = p; }
  });
  return best;
}

// ─── State ────────────────────────────────────────────────────────────────────
let allRows = [];
let posFilter = "ALL";
let sortCol = "pick";
let sortDir = 1;

// ─── Sleeper fetch ────────────────────────────────────────────────────────────
const LEAGUE_ID = "1312799736218017792";

async function loadDraft() {
  setStep("Sleeper: Drafts abrufen…");

  const draftsRes = await fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/drafts`);
  const drafts = await draftsRes.json();
  if (!drafts?.length) throw new Error("Keine Drafts gefunden.");

  const draft = drafts.find(d => d.type === "rookie") || drafts[0];
  const draftId = draft.draft_id;

  setStep("Picks laden…");
  const [picksRes, usersRes, rostersRes] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/draft/${draftId}/picks`),
    fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/users`),
    fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/rosters`),
  ]);
  const picks   = await picksRes.json();
  const users   = await usersRes.json();
  const rosters = await rostersRes.json();

  const userMap = {};
  users.forEach(u => { userMap[u.user_id] = u.metadata?.team_name || u.display_name || u.username; });
  const rosterUser = {};
  rosters.forEach(r => { rosterUser[r.roster_id] = r.owner_id; });

  allRows = picks.map(pick => {
    const m = pick.metadata || {};
    const fullName = (m.first_name && m.last_name) ? `${m.first_name} ${m.last_name}` : (m.name || pick.player_id || "?");
    const pickNum = pick.pick_no || ((pick.round - 1) * 12 + pick.draft_slot);
    const userId = rosterUser[pick.roster_id] || pick.picked_by;
    const drafter = userMap[userId] || `Team ${pick.roster_id}`;
    const position = m.position || "?";
    const ktc = findKtc(fullName);
    return {
      fullName, pickNum, round: pick.round, drafter, position,
      ktcRank: ktc?.rank || null,
      ktcValue: ktc?.value || null,
      ktcTeam: ktc?.team || m.team || "",
    };
  });

  setBadge("done", `${allRows.length} Picks geladen`);
  renderTable();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderTable() {
  const search = norm(document.getElementById("searchInput").value);
  const filtered = allRows
    .filter(r => posFilter === "ALL" || r.position === posFilter)
    .filter(r => !search || norm(r.fullName).includes(search) || norm(r.drafter).includes(search))
    .sort((a, b) => {
      let av, bv;
      if      (sortCol === "pick")    { av = a.pickNum;         bv = b.pickNum; }
      else if (sortCol === "name")    { av = a.fullName;        bv = b.fullName; }
      else if (sortCol === "pos")     { av = a.position;        bv = b.position; }
      else if (sortCol === "drafter") { av = a.drafter;         bv = b.drafter; }
      else if (sortCol === "rank")    { av = a.ktcRank||9999;   bv = b.ktcRank||9999; }
      else if (sortCol === "value")   { av = -(a.ktcValue||0);  bv = -(b.ktcValue||0); }
      else { av = a.pickNum; bv = b.pickNum; }
      return av > bv ? sortDir : av < bv ? -sortDir : 0;
    });

  const rankCls = r => !r ? "rank-none" : r<=10 ? "rank-top10" : r<=25 ? "rank-top25" : "rank-lower";

  document.getElementById("main").innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${[["pick","Pick"],["name","Spieler"],["pos","Pos"],["team","NFL-Team"],["drafter","Gedraftet von"],["rank","KTC Rank"],["value","KTC Value"]]
            .map(([c,l]) => `<th data-col="${c}" class="${sortCol===c?(sortDir>0?'asc active':'desc active'):''}"">${l}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${filtered.length === 0
            ? `<tr><td colspan="7" style="text-align:center;color:#3a4258;padding:60px 0;font-size:13px">Keine Spieler gefunden</td></tr>`
            : filtered.map((r,i) => `
            <tr style="animation-delay:${i*.028}s">
              <td><div class="pick-num">${r.pickNum}</div><div class="pick-round">Runde ${r.round}</div></td>
              <td style="font-weight:600;min-width:160px">${r.fullName}</td>
              <td><span class="pos-badge ${r.position}">${r.position}</span></td>
              <td style="font-size:12px;color:var(--muted)">${r.ktcTeam||"—"}</td>
              <td style="font-size:13px;color:var(--muted)">${r.drafter}</td>
              <td><span class="rank-val ${rankCls(r.ktcRank)}">${r.ktcRank?"#"+r.ktcRank:"—"}</span></td>
              <td style="min-width:130px">
                ${r.ktcValue!=null?`
                  <div class="vbar-wrap">
                    <span class="vbar-num">${r.ktcValue.toLocaleString()}</span>
                    <div class="vbar-bg"><div class="vbar-fill" style="width:${Math.round(r.ktcValue/KTC_MAX*100)}%"></div></div>
                  </div>`:
                  `<span style="font-size:12px;color:#252c3e">—</span>`}
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  // Re-attach sort listeners
  document.querySelectorAll("th[data-col]").forEach(th => {
    th.addEventListener("click", () => {
      const c = th.dataset.col;
      if (sortCol === c) sortDir *= -1; else { sortCol = c; sortDir = 1; }
      renderTable();
    });
  });
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function setStep(msg) { const el=document.getElementById("loadTxt"); if(el) el.textContent=msg; }
function setBadge(state, msg) {
  document.getElementById("badgeTxt").textContent = msg;
  const d = document.getElementById("dot");
  d.className = "dot" + (state==="loading"?" loading":state==="error"?" error":"");
}

// ─── Event listeners ──────────────────────────────────────────────────────────
document.querySelectorAll(".fbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    posFilter = btn.dataset.pos;
    document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    if (allRows.length) renderTable();
  });
});
document.getElementById("searchInput").addEventListener("input", () => {
  if (allRows.length) renderTable();
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
setBadge("loading", "Laden…");
loadDraft().catch(err => {
  document.getElementById("main").innerHTML =
    `<div class="err-box"><strong>Fehler:</strong> ${err.message}<br><br><small>Überprüfe die League ID und versuche es erneut.</small></div>`;
  setBadge("error", "Fehler");
  console.error(err);
});
</script>
</body>
</html>
