<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rookie Draft Board 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    --bg:#0a0c10; --surface:#12151c; --surface2:#1a1f2a; --surface3:#0e1018;
    --border:#1e2330; --text:#e8ecf4; --muted:#6b7589; --dim:#3a4258;
    --accent:#f0b429; --accent2:#e05c2a; --green:#3ecf8e; --red:#f87171;
    --blue:#60a5fa; --purple:#a78bfa; --shadow:rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --bg:#f0f2f7; --surface:#ffffff; --surface2:#eaecf3; --surface3:#f7f8fb;
    --border:#dde0ea; --text:#1a1d2e; --muted:#6b7589; --dim:#9ba5bc;
    --accent:#c98f0a; --accent2:#c04e22; --green:#1fa870; --red:#dc2626;
    --blue:#2563eb; --purple:#7c3aed; --shadow:rgba(0,0,0,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;transition:background .2s,color .2s;}

  header{padding:40px 40px 24px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
  header::after{content:'2026';position:absolute;right:-6px;top:-14px;font-family:'Bebas Neue';font-size:min(170px,28vw);color:rgba(240,180,41,0.05);pointer-events:none;line-height:1;}
  .header-inner{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  h1{font-family:'Bebas Neue';font-size:clamp(36px,6.5vw,72px);line-height:.88;letter-spacing:2px;}
  h1 span{color:var(--accent);}
  .subtitle{font-size:11px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-top:10px;}
  .hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .badge{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:8px 16px;font-size:12px;color:var(--muted);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .dot.loading{background:var(--accent);animation:pulse 1.2s infinite;}
  .dot.error{background:var(--red);}

  .theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;}
  .theme-btn:hover{border-color:var(--accent);}

  .tab-nav{display:flex;border-bottom:1px solid var(--border);padding:0 40px;overflow-x:auto;background:var(--surface3);}
  .tab{padding:13px 20px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;font-family:'DM Sans';}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab:hover{color:var(--text);}

  .controls{padding:13px 40px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface3);}
  .fbtn{padding:5px 14px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans';font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s;}
  .fbtn.active,.fbtn:hover{border-color:var(--accent);color:var(--accent);background:rgba(240,180,41,0.08);}
  .spacer{flex:1;min-width:8px;}
  .srch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;}
  .srch input{background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans';font-size:13px;width:150px;}
  .srch input::placeholder{color:var(--dim);}

  .table-wrap{padding:16px 40px 60px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  thead tr{border-bottom:1px solid var(--border);}
  th{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding:11px 11px;text-align:left;font-weight:500;cursor:pointer;white-space:nowrap;user-select:none;transition:color .15s;}
  th:hover{color:var(--text);}
  th.active{color:var(--accent);}
  th.asc::after{content:' ↑';color:var(--accent);}
  th.desc::after{content:' ↓';color:var(--accent);}
  tbody tr{border-bottom:1px solid rgba(30,35,48,.4);transition:background .1s;animation:rowIn .3s ease both;}
  [data-theme="light"] tbody tr{border-bottom-color:rgba(221,224,234,.6);}
  tbody tr:hover{background:var(--surface2);}
  td{padding:11px 11px;font-size:13px;vertical-align:middle;}

  .pick-num{font-family:'Bebas Neue';font-size:21px;color:var(--dim);line-height:1;}
  .pick-round{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;opacity:.6;}

  .pos-badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;min-width:36px;text-align:center;}
  .QB{background:rgba(224,92,42,.14);color:#e05c2a;border:1px solid rgba(224,92,42,.28);}
  .RB{background:rgba(62,207,142,.11);color:var(--green);border:1px solid rgba(62,207,142,.24);}
  [data-theme="light"] .RB{color:#1fa870;}
  .WR{background:rgba(240,180,41,.11);color:var(--accent);border:1px solid rgba(240,180,41,.24);}
  .TE{background:rgba(167,139,250,.11);color:var(--purple);border:1px solid rgba(167,139,250,.24);}
  [data-theme="light"] .TE{color:#7c3aed;}

  .rank-big{font-family:'Bebas Neue';font-size:21px;}
  .top5{color:var(--green);}
  .top15{color:var(--accent);}
  .top30{color:var(--blue);}
  .lower{color:var(--muted);}
  .rnone{font-family:'DM Sans';font-size:12px;color:var(--dim);}

  .tier-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.5px;}
  .t1{background:rgba(62,207,142,.12);color:var(--green);border:1px solid rgba(62,207,142,.25);}
  .t2{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.25);}
  .t3{background:rgba(240,180,41,.12);color:var(--accent);border:1px solid rgba(240,180,41,.25);}
  .t4{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.22);}
  .t5{background:rgba(107,117,137,.1);color:var(--muted);border:1px solid rgba(107,117,137,.22);}

  .trend-pos{color:var(--green);font-weight:600;}
  .trend-neg{color:var(--red);font-weight:600;}
  .trend-neu{color:var(--muted);}

  .steal-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:100px;font-size:10px;font-weight:700;white-space:nowrap;}
  .steal-great{background:rgba(62,207,142,.12);color:var(--green);border:1px solid rgba(62,207,142,.25);}
  .steal-good{background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.2);}
  .steal-fair{background:rgba(240,180,41,.1);color:var(--accent);border:1px solid rgba(240,180,41,.2);}
  .steal-reach{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2);}

  .vbar-wrap{display:flex;align-items:center;gap:8px;}
  .vbar-num{font-weight:600;font-size:12px;min-width:38px;text-align:right;}
  .vbar-bg{flex:1;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;min-width:48px;}
  .vbar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));}

  /* ── Team cards ── */
  .teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding:20px 40px 60px;}
  .team-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow .2s;}
  .team-card:hover{box-shadow:0 4px 24px var(--shadow);}
  .team-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
  .team-name{font-weight:700;font-size:15px;}
  .team-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .draft-grade{font-family:'Bebas Neue';font-size:36px;line-height:1;}
  .gA{color:var(--green);}
  .gB{color:var(--accent);}
  .gC{color:var(--blue);}
  .gD{color:var(--red);}
  .team-stats{padding:11px 18px;display:flex;gap:16px;border-bottom:1px solid var(--border);}
  .tstat{flex:1;}
  .tstat-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
  .tstat-val{font-size:14px;font-weight:600;}
  .team-picks-list{padding:10px 18px 14px;}
  .tp-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tp-row:last-child{border-bottom:none;}
  [data-theme="light"] .tp-row{border-bottom-color:rgba(221,224,234,.5);}
  .tp-num{font-family:'Bebas Neue';font-size:15px;color:var(--dim);min-width:22px;}
  .tp-name{flex:1;font-size:13px;font-weight:500;}
  .draft-note{padding:10px 18px 14px;font-size:12px;color:var(--muted);font-style:italic;line-height:1.55;border-top:1px solid var(--border);}

  /* ── Liga overview ── */
  .liga-overview{padding:20px 40px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .liga-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
  .liga-card-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
  .liga-card-val{font-size:15px;font-weight:700;}
  .liga-card-sub{font-size:11px;color:var(--muted);}
  .liga-divider{height:1px;background:var(--border);margin:20px 40px 0;}

  /* Ranking toggle */
  .rank-toggle{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .rtbtn{padding:4px 12px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans';font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .rtbtn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px var(--shadow);}
  .rtbtn.ktc-active{color:#3ecf8e;}
  .rtbtn.fc-active{color:#60a5fa;}
  .fc-loading{font-size:10px;color:var(--muted);letter-spacing:1px;animation:pulse 1.2s infinite;}

  /* Best pick highlight */
  .tp-row.best-pick{background:rgba(62,207,142,0.06);border-radius:6px;padding-left:6px;padding-right:6px;margin:0 -6px;}
  [data-theme="light"] .tp-row.best-pick{background:rgba(31,168,112,0.07);}
  .best-badge{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--green);background:rgba(62,207,142,.12);border:1px solid rgba(62,207,142,.25);padding:1px 6px;border-radius:4px;white-space:nowrap;}

  /* Trend warning */
  .trend-warn{font-size:11px;color:var(--red);font-style:italic;padding:6px 18px 8px;border-top:1px solid rgba(248,113,113,.15);background:rgba(248,113,113,.04);}
  .trend-warn-label{font-weight:600;font-style:normal;}

  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;gap:20px;}
  .spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  .load-txt{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
  .err-box{margin:32px 40px;padding:18px 22px;background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.18);border-radius:8px;color:var(--red);font-size:13px;line-height:1.7;}
  .ktc-note{padding:7px 40px;font-size:10px;color:var(--dim);border-bottom:1px solid var(--border);background:var(--surface3);}
  .ktc-note a{color:var(--muted);}

  @keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  @media(max-width:680px){
    header,.controls,.table-wrap,.ktc-note,.teams-grid,.tab-nav{padding-left:14px;padding-right:14px;}
    header::after{display:none;}
    .vbar-bg{display:none;}
    .teams-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>ROOKIE<br><span>DRAFT</span> BOARD</h1>
      <p class="subtitle">Dynasty League · 2026 Season</p>
    </div>
    <div class="hdr-right">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <div class="badge">
        <span class="dot loading" id="dot"></span>
        <span id="badgeTxt">Laden…</span>
      </div>
    </div>
  </div>
</header>

<div class="tab-nav">
  <button class="tab active" onclick="switchTab('picks',this)">📋 Alle Picks</button>
  <button class="tab" onclick="switchTab('teams',this)">🏆 Team-Analyse</button>
  <button class="tab" onclick="switchTab('liga',this)">🌍 Liga-Übersicht</button>
</div>

<div class="controls">
  <button class="fbtn active" data-pos="ALL">Alle</button>
  <button class="fbtn" data-pos="QB">QB</button>
  <button class="fbtn" data-pos="RB">RB</button>
  <button class="fbtn" data-pos="WR">WR</button>
  <button class="fbtn" data-pos="TE">TE</button>
  <div class="spacer"></div>
  <div class="rank-toggle">
    <button class="rtbtn active ktc-active" id="btnKTC" onclick="switchRanking('ktc')">KTC</button>
    <button class="rtbtn" id="btnFC" onclick="switchRanking('fc')">FantasyCalc</button>
  </div>
  <div class="srch">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="color:var(--dim)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Spieler / Team…">
  </div>
</div>

<div class="ktc-note" id="sourceNote">
  KTC: 1QB / 0.5 PPR · Stand Mai 2026 ·
  <a href="https://keeptradecut.com/dynasty-rankings/rookie-rankings" target="_blank">keeptradecut.com ↗</a>
</div>

<div id="main">
  <div class="center">
    <div class="spinner"></div>
    <p class="load-txt" id="loadTxt">Sleeper Draft laden…</p>
  </div>
</div>

<script>
// ── KTC Data (1QB/0.5PPR, Mai 2026, aus PDF) ──────────────────────────────────
// [name, pos, rank, value, tier, trend30, nflTeam]
const KTC_RAW = [
  ["Jeremiyah Love",      "RB",  1, 7889,  1,   0, "ARI"],

  ["Fernando Mendoza",    "QB",  9, 4703,  3,  -3, "LVR"],

  ["Germie Bernard",      "WR", 15, 3388,  5,   9, "PIT"],
  ["Elijah Sarratt",      "WR", 16, 3294,  5,  -1, "BAL"],
  ["Zachariah Branch",    "WR", 17, 3260,  5,   2, "ATL"],

  ["Garrett Nussmeier",   "QB", 32, 1671,  8,  -2, "KCC"],
  ["Michael Trigg",       "TE", 33, 1540,  8,  -4, "DAL"],
  ["Justin Joly",         "TE", 34, 1350,  9,  18, "DEN"],
  ["Brenen Thompson",     "WR", 35, 1323,  9,  17, "LAC"],
  ["Le'Veon Moss",        "RB", 36, 1243, 10,  -2, "MIA"],

  ["Eli Heidenreich",     "RB", 47,  878, 12,  13, "PIT"],
  ["J'Mari Taylor",       "RB", 49,  844, 12, -11, "JAC"],
  ["CJ Daniels",          "WR", 50,  828, 12, -13, "LAR"],
  ["Caleb Douglas",       "WR", 51,  823, 12,   8, "MIA"],
  ["Adam Randall",        "RB", 53,  712, 12,   4, "BAL"],
  ["Reggie Virgil",       "WR", 55,  620, 12, -10, "ARI"],
  ["Drew Allar",          "QB", 60,  136, 13, -13, "PIT"],
  ["Carson Beck",         "QB", 62,   98, 13, -15, "ARI"],
];
const KTC_MAX = 7889;

const ktcMap = {};
KTC_RAW.forEach(([name,pos,rank,value,tier,trend,nflTeam])=>{
  ktcMap[norm(name)]={name,pos,rank,value,tier,trend,nflTeam};
});

function norm(s=""){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}
function nameSim(a,b){
  const na=norm(a),nb=norm(b);
  if(na===nb) return 1;
  const pa=na.split(" "),pb=nb.split(" ");
  if(pa.length>=2&&pb.length>=2){
    if(pa[pa.length-1]===pb[pb.length-1]&&pa[0][0]===pb[0][0]) return 0.9;
    if(pa[pa.length-1]===pb[pb.length-1]) return 0.7;
  }
  return 0;
}
function findKtc(name){
  const n=norm(name);
  if(ktcMap[n]) return ktcMap[n];
  let best=null,bs=0;
  Object.values(ktcMap).forEach(p=>{
    const s=nameSim(name,p.name);
    if(s>bs&&s>=0.85){bs=s;best=p;}
  });
  return best;
}

// ── Steal ─────────────────────────────────────────────────────────────────────
function stealInfo(pickNum, rank){
  if(!rank) return null;
  const d=pickNum-rank;
  if(d>=8)  return{label:"🔥 Großer Steal",cls:"steal-great",d};
  if(d>=4)  return{label:"✅ Steal",cls:"steal-good",d};
  if(d>=-3) return{label:"≈ Fair Value",cls:"steal-fair",d};
  if(d>=-7) return{label:"⚠ Leichter Reach",cls:"steal-reach",d};
  return        {label:"❌ Reach",cls:"steal-reach",d};
}

// ── Grade (Steal-Delta + Rundenbonus + Trade-Malus/Bonus) ─────────────────────
const ROUND_MULT={1:2.0, 2:1.3, 3:1.0, 4:0.5};

function weightedDelta(pick){
  const rank=getActiveRank(pick);
  if(!rank||pick.round>4) return null;
  return (pick.pickNum-rank)*(ROUND_MULT[pick.round]||0.5);
}

function calcGrade(picks, tradeBalance=0){
  const valid=picks.filter(p=>getActiveRank(p)&&p.round<=4);
  if(!valid.length) return{grade:"—",cls:"",score:null,avgTier:null,avgTrend:null,wDelta:null,tradeBalance,note:"Keine bewertbaren Picks."};

  const deltas=valid.map(p=>weightedDelta(p)).filter(d=>d!==null);
  const wDelta=deltas.length ? deltas.reduce((s,d)=>s+d,0)/deltas.length : 0;

  const avgTier =(valid.reduce((s,p)=>s+(getActiveTier(p)||5),0)/valid.length).toFixed(1);
  const avgTrend=(valid.reduce((s,p)=>s+(p.ktcTrend||0),0)/valid.length).toFixed(1);
  const avgVal  =Math.round(valid.reduce((s,p)=>s+(getActiveValue(p)||0),0)/valid.length);

  const tradeAdj=tradeBalance/2000;
  const score=wDelta+tradeAdj;

  let grade,cls,note;
  if(score>=12)     {grade="A+";cls="gA";note="Herausragendes Draft — exzellentes Steal-Timing und clevere Trades.";}
  else if(score>=7) {grade="A"; cls="gA";note="Starkes Draft. Viele Picks später gegangen als ihr Ranking.";}
  else if(score>=3) {grade="B+";cls="gB";note="Gutes Draft mit positivem Steal-Saldo.";}
  else if(score>=0) {grade="B"; cls="gB";note="Solides Draft — ungefähr Fair Value insgesamt.";}
  else if(score>=-4){grade="C"; cls="gC";note="Durchwachsenes Draft — leicht zu viel bezahlt.";}
  else              {grade="D"; cls="gD";note="Teures Draft — mehrere Reaches über Rundenbonus gewichtet.";}

  const steals=valid.filter(p=>(p.pickNum-(getActiveRank(p)||0))>=4);
  const reaches=valid.filter(p=>(p.pickNum-(getActiveRank(p)||0))<=-5);
  if(steals.length>=2) note+=` ${steals.length}× Steal-Pick! 🎯`;
  if(reaches.length>=2) note+=` ${reaches.length}× teurer Reach.`;
  if(tradeBalance>=2000) note+=" Trades haben sich ausgezahlt 🔄✅";
  else if(tradeBalance<=-2000) note+=" Trades haben Wert gekostet 🔄❌";
  if(parseFloat(avgTrend)>8) note+=" Trend stark nach oben 📈";
  else if(parseFloat(avgTrend)<-8) note+=" Vorsicht: Trend rückläufig 📉";

  return{grade,cls,score:score.toFixed(1),avgTier,avgTrend,avgValue:avgVal,wDelta:wDelta.toFixed(1),tradeBalance,note};
}

// ── State ─────────────────────────────────────────────────────────────────────
let allRows=[];
let tradeBalances={};
let curTab="picks";
let posFilter="ALL";
let sortCol="pick",sortDir=1;
let rankingMode="ktc"; // "ktc" | "fc"
let fcData=null;       // FantasyCalc data once loaded
let fcLoading=false;
const LEAGUE_ID="1312799736218017792";
const LEAGUE_SIZE=14; // ← 14 Teams

// ── Active ranking helpers (abstracted over KTC/FC) ──────────────────────────
function getActiveRank(row)  { return rankingMode==="fc" ? row.fcRank  : row.ktcRank;  }
function getActiveValue(row) { return rankingMode==="fc" ? row.fcValue : row.ktcValue; }
function getActiveTier(row)  { return rankingMode==="fc" ? row.fcTier  : row.ktcTier;  }
function getActiveTrend(row) { return row.ktcTrend; } // FC has no trend, always use KTC
function getActiveMax()      { return rankingMode==="fc" ? FC_MAX : KTC_MAX; }

// ── FantasyCalc ───────────────────────────────────────────────────────────────
let FC_MAX=10000;
const fcMap={};

function buildFcMap(data){
  FC_MAX=0;
  data.forEach(item=>{
    const p=item.player||item;
    const name=p.name||p.playerName||"";
    const n=norm(name);
    const val=item.value||item.overallValue||0;
    if(val>FC_MAX) FC_MAX=val;
    if(n) fcMap[n]={name,pos:p.position||p.pos||"?",rank:item.overallRank||item.rank||null,value:val,nflTeam:p.maybeTeam||p.team||""};
  });
}

function findFc(name){
  const n=norm(name);
  if(fcMap[n]) return fcMap[n];
  let best=null,bs=0;
  Object.values(fcMap).forEach(p=>{
    const s=nameSim(name,p.name);
    if(s>bs&&s>=0.85){bs=s;best=p;}
  });
  return best;
}

async function loadFC(){
  if(fcData||fcLoading) return;
  fcLoading=true;
  document.getElementById("btnFC").innerHTML='<span class="fc-loading">laden…</span>';
  try{
    // FantasyCalc public API — dynasty, 1QB, 0.5PPR, 14 teams
    const res=await fetch(`https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=1&numTeams=${LEAGUE_SIZE}&ppr=0.5`);
    if(!res.ok) throw new Error("FC "+res.status);
    fcData=await res.json();
    buildFcMap(Array.isArray(fcData)?fcData:fcData.players||[]);
    // Enrich allRows with FC data
    allRows.forEach(r=>{
      const fc=findFc(r.fullName);
      r.fcRank=fc?.rank||null;
      r.fcValue=fc?.value||null;
      r.fcTier=null; // FC has no tiers
    });
    document.getElementById("btnFC").textContent="FantasyCalc";
    fcLoading=false;
    renderView();
  } catch(e){
    console.warn("FantasyCalc failed:",e);
    document.getElementById("btnFC").textContent="FC (N/A)";
    fcLoading=false;
  }
}

// ── Ranking toggle ────────────────────────────────────────────────────────────
function switchRanking(mode){
  rankingMode=mode;
  document.getElementById("btnKTC").className="rtbtn"+(mode==="ktc"?" active ktc-active":"");
  document.getElementById("btnFC").className ="rtbtn"+(mode==="fc" ?" active fc-active":"");
  const note=document.getElementById("sourceNote");
  if(mode==="ktc"){
    note.innerHTML='KTC: 1QB / 0.5 PPR · Stand Mai 2026 · <a href="https://keeptradecut.com/dynasty-rankings/rookie-rankings" target="_blank">keeptradecut.com ↗</a>';
    renderView();
  } else {
    note.innerHTML='FantasyCalc: 1QB / 0.5 PPR · 14 Teams · Live · <a href="https://fantasycalc.com/rankings" target="_blank">fantasycalc.com ↗</a>';
    if(!fcData&&!fcLoading) loadFC(); else if(fcData) renderView();
  }
}

// ── Sleeper ───────────────────────────────────────────────────────────────────
async function loadDraft(){
  setStep("Sleeper: Drafts abrufen…");
  const drafts=await(await fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/drafts`)).json();
  if(!drafts?.length) throw new Error("Keine Drafts gefunden.");
  const draft=drafts.find(d=>d.type==="rookie")||drafts[0];

  setStep("Picks + Manager + Trades laden…");
  const[picks,users,rosters,transactions]=await Promise.all([
    fetch(`https://api.sleeper.app/v1/draft/${draft.draft_id}/picks`).then(r=>r.json()),
    fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/users`).then(r=>r.json()),
    fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/rosters`).then(r=>r.json()),
    fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/transactions/0`).then(r=>r.json()).catch(()=>[]),
  ]);

  const userMap={};
  users.forEach(u=>{userMap[u.user_id]=u.metadata?.team_name||u.display_name||u.username;});
  const rosterUser={};
  rosters.forEach(r=>{rosterUser[r.roster_id]=r.owner_id;});
  const rosterName={};
  rosters.forEach(r=>{rosterName[r.roster_id]=userMap[r.owner_id]||`Team ${r.roster_id}`;});

  allRows=picks.map(pick=>{
    const m=pick.metadata||{};
    const fullName=(m.first_name&&m.last_name)?`${m.first_name} ${m.last_name}`:(m.name||pick.player_id||"?");
    // Fix: use LEAGUE_SIZE for correct pick number calculation
    const pickNum=pick.pick_no||((pick.round-1)*LEAGUE_SIZE+pick.draft_slot);
    const userId=rosterUser[pick.roster_id]||pick.picked_by;
    const drafter=userMap[userId]||`Team ${pick.roster_id}`;
    const position=m.position||"?";
    const ktc=findKtc(fullName);
    return{fullName,pickNum,round:pick.round,drafter,position,
      rosterId:pick.roster_id,
      ktcRank:ktc?.rank||null,ktcValue:ktc?.value||null,
      ktcTier:ktc?.tier||null,ktcTrend:ktc?.trend||null,
      ktcTeam:ktc?.nflTeam||m.team||"",
      fcRank:null,fcValue:null,fcTier:null};
  });

  // ── Trade analysis ────────────────────────────────────────────────────────
  tradeBalances={};
  rosters.forEach(r=>{tradeBalances[rosterName[r.roster_id]]=0;});

  if(Array.isArray(transactions)){
    transactions.filter(t=>t.type==="trade"&&t.draft_picks?.length).forEach(trade=>{
      const roundVal={1:4500,2:2200,3:900,4:150};
      trade.draft_picks.forEach(dp=>{
        const fromTeam=rosterName[dp.previous_owner_id]||rosterName[dp.roster_id];
        const toTeam  =rosterName[dp.owner_id];
        const val=roundVal[dp.round]||200;
        if(fromTeam&&tradeBalances[fromTeam]!==undefined) tradeBalances[fromTeam]-=val;
        if(toTeam  &&tradeBalances[toTeam]  !==undefined) tradeBalances[toTeam]  +=val;
      });
    });
  }

  setBadge("done",`${allRows.length} Picks · ${LEAGUE_SIZE} Teams`);
  renderView();
}

// ── Render router ────────────────────────────────────────────────────────────
function renderView(){
  if(curTab==="picks") renderPicks();
  else if(curTab==="teams") renderTeams();
  else renderLiga();
}

const tierCls=t=>["","t1","t2","t3","t4","t5"][Math.min(t||5,5)]||"t5";
const trendHtml=t=>{
  if(t===null||t===undefined) return '<span class="trend-neu">—</span>';
  if(t>0) return`<span class="trend-pos">▲${t}</span>`;
  if(t<0) return`<span class="trend-neg">▼${Math.abs(t)}</span>`;
  return'<span class="trend-neu">0</span>';
};
const rankCls=r=>!r?"rnone":r<=5?"top5":r<=15?"top15":r<=30?"top30":"lower";

function renderPicks(){
  const q=norm(document.getElementById("searchInput").value);
  const rows=allRows
    .filter(r=>posFilter==="ALL"||r.position===posFilter)
    .filter(r=>!q||norm(r.fullName).includes(q)||norm(r.drafter).includes(q))
    .sort((a,b)=>{
      let av,bv;
      if(sortCol==="pick")    {av=a.pickNum;bv=b.pickNum;}
      else if(sortCol==="name")    {av=a.fullName;bv=b.fullName;}
      else if(sortCol==="pos")     {av=a.position;bv=b.position;}
      else if(sortCol==="drafter") {av=a.drafter;bv=b.drafter;}
      else if(sortCol==="rank")    {av=a.ktcRank||9999;bv=b.ktcRank||9999;}
      else if(sortCol==="value")   {av=-(a.ktcValue||0);bv=-(b.ktcValue||0);}
      else if(sortCol==="tier")    {av=a.ktcTier||99;bv=b.ktcTier||99;}
      else if(sortCol==="trend")   {av=-(a.ktcTrend||0);bv=-(b.ktcTrend||0);}
      else{av=a.pickNum;bv=b.pickNum;}
      return av>bv?sortDir:av<bv?-sortDir:0;
    });

  document.getElementById("main").innerHTML=`
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${[["pick","Pick"],["name","Spieler"],["pos","Pos"],["team","NFL"],["drafter","Gedraftet von"],["rank","KTC #"],["tier","Tier"],["trend","30d"],["value","Value"],["steal","Steal?"]]
            .map(([c,l])=>`<th data-col="${c}" class="${sortCol===c?(sortDir>0?"asc active":"desc active"):""}">${l}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${!rows.length
            ?`<tr><td colspan="10" style="text-align:center;color:var(--dim);padding:60px 0;font-size:13px">Keine Spieler gefunden</td></tr>`
            :rows.map((r,i)=>{
              const aRank=getActiveRank(r);
              const aVal=getActiveValue(r);
              const aTier=getActiveTier(r);
              const aMax=getActiveMax();
              const st=stealInfo(r.pickNum,aRank);
              const src=rankingMode==="fc"?"FC":"KTC";
              return`<tr style="animation-delay:${i*.024}s">
                <td><div class="pick-num">${r.pickNum}</div><div class="pick-round">R${r.round}</div></td>
                <td style="font-weight:600;min-width:148px">${r.fullName}</td>
                <td><span class="pos-badge ${r.position}">${r.position}</span></td>
                <td style="font-size:11px;color:var(--muted)">${r.ktcTeam||"—"}</td>
                <td style="font-size:12px;color:var(--muted);min-width:110px">${r.drafter}</td>
                <td><span class="rank-big ${rankCls(aRank)}">${aRank?"#"+aRank:"—"}</span></td>
                <td>${aTier?`<span class="tier-badge ${tierCls(aTier)}">T${aTier}</span>`:`<span style="color:var(--dim);font-size:11px">${rankingMode==="fc"?"n/a":"—"}</span>`}</td>
                <td>${trendHtml(r.ktcTrend)}${rankingMode==="fc"?`<span style="font-size:9px;color:var(--dim);margin-left:3px">(KTC)</span>`:""}</td>
                <td style="min-width:118px">${aVal!=null?`<div class="vbar-wrap"><span class="vbar-num">${aVal.toLocaleString()}</span><div class="vbar-bg"><div class="vbar-fill" style="width:${Math.round(aVal/aMax*100)}%"></div></div></div>`:`<span style="color:var(--dim);font-size:12px">—</span>`}</td>
                <td>${st?`<span class="steal-badge ${st.cls}">${st.label}</span>`:`<span style="color:var(--dim);font-size:12px">—</span>`}</td>
              </tr>`;}).join("")}
        </tbody>
      </table>
    </div>`;

  document.querySelectorAll("th[data-col]").forEach(th=>{
    th.addEventListener("click",()=>{
      const c=th.dataset.col;
      if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1;}
      renderPicks();
    });
  });
}

function renderTeams(){
  const q=norm(document.getElementById("searchInput").value);
  const teams={};
  allRows.forEach(r=>{if(!teams[r.drafter])teams[r.drafter]=[];teams[r.drafter].push(r);});

  const list=Object.entries(teams)
    .filter(([n])=>!q||norm(n).includes(q))
    .sort((a,b)=>{
      const ga=calcGrade(a[1],tradeBalances[a[0]]||0);
      const gb=calcGrade(b[1],tradeBalances[b[0]]||0);
      return parseFloat(gb.score||0)-parseFloat(ga.score||0);
    });

  document.getElementById("main").innerHTML=`
    <div class="teams-grid">
      ${list.map(([name,picks])=>{
        const tb=tradeBalances[name]||0;
        const g=calcGrade(picks,tb);
        const sorted=[...picks].sort((a,b)=>a.pickNum-b.pickNum);
        const valid=picks.filter(p=>getActiveRank(p)&&p.round<=4);
        const trendNum=parseFloat(g.avgTrend||0);
        const wD=parseFloat(g.wDelta||0);

        // Best pick = highest weighted delta
        const bestPick=valid.length
          ? valid.reduce((best,p)=>((weightedDelta(p)||0)>(weightedDelta(best)||0)?p:best), valid[0])
          : null;

        // Trend warnings: picks with strong negative 30d trend
        const trendWarns=picks.filter(p=>p.ktcTrend!=null&&p.ktcTrend<=-10);

        return`
        <div class="team-card">
          <div class="team-header">
            <div>
              <div class="team-name">${name}</div>
              <div class="team-sub">${picks.length} Picks · ${valid.length} bewertet (R1–R4) · Score: ${g.score||"—"}</div>
            </div>
            <div class="draft-grade ${g.cls}">${g.grade}</div>
          </div>
          <div class="team-stats">
            <div class="tstat">
              <div class="tstat-label">Ø Steal-Score</div>
              <div class="tstat-val" style="color:${wD>0?"var(--green)":wD<0?"var(--red)":"var(--muted)"}">
                ${g.wDelta!=null?(wD>=0?"+":"")+wD:"—"}
              </div>
            </div>
            <div class="tstat">
              <div class="tstat-label">Trade-Bilanz</div>
              <div class="tstat-val" style="color:${tb>0?"var(--green)":tb<0?"var(--red)":"var(--muted)"}">
                ${tb>0?"▲ +"+tb.toLocaleString():tb<0?"▼ "+tb.toLocaleString():"≈ 0"}
              </div>
            </div>
            <div class="tstat">
              <div class="tstat-label">Ø 30d Trend</div>
              <div class="tstat-val" style="color:${trendNum>0?"var(--green)":trendNum<0?"var(--red)":"var(--muted)"}">
                ${g.avgTrend!=null?(trendNum>=0?"▲ ":"▼ ")+Math.abs(trendNum):"—"}
              </div>
            </div>
          </div>
          <div class="team-picks-list">
            ${sorted.map(p=>{
              const st=stealInfo(p.pickNum,p.ktcRank);
              const wd=weightedDelta(p);
              const isBest=bestPick&&p.fullName===bestPick.fullName&&p.pickNum===bestPick.pickNum;
              return`<div class="tp-row${isBest?" best-pick":""}">
                <span class="tp-num">${p.pickNum}</span>
                <span class="pos-badge ${p.position}" style="font-size:9px;padding:1px 6px">${p.position}</span>
                <span class="tp-name">${p.fullName}</span>
                ${isBest?`<span class="best-badge">⭐ Best Pick</span>`:""}
                ${p.ktcTier?`<span class="tier-badge ${tierCls(p.ktcTier)}" style="font-size:9px;padding:1px 6px">T${p.ktcTier}</span>`:""}
                ${st?`<span class="steal-badge ${st.cls}" style="font-size:9px;padding:2px 6px">${st.label}${wd!==null?" ("+(wd>=0?"+":"")+wd.toFixed(1)+")":""}</span>`:""}
              </div>`;}).join("")}
          </div>
          ${trendWarns.length?`
          <div class="trend-warn">
            <span class="trend-warn-label">⚠ Trend-Warnung:</span>
            ${trendWarns.map(p=>`${p.fullName} (▼${Math.abs(p.ktcTrend)})`).join(", ")}
          </div>`:""}
          <div class="draft-note">💬 ${g.note}</div>
        </div>`;}).join("")}
    </div>`;
}

// ── Liga overview ─────────────────────────────────────────────────────────────
function renderLiga(){
  if(!allRows.length) return;

  // Best steal of the draft
  const withKtc=allRows.filter(p=>p.ktcRank);
  const bestSteal=withKtc.length
    ? withKtc.reduce((b,p)=>(weightedDelta(p)||0)>(weightedDelta(b)||0)?p:b, withKtc[0])
    : null;
  const biggestReach=withKtc.length
    ? withKtc.reduce((b,p)=>(weightedDelta(p)||0)<(weightedDelta(b)||0)?p:b, withKtc[0])
    : null;

  // Best drafter by score
  const teams={};
  allRows.forEach(r=>{if(!teams[r.drafter])teams[r.drafter]=[];teams[r.drafter].push(r);});
  const graded=Object.entries(teams).map(([n,p])=>({name:n,g:calcGrade(p,tradeBalances[n]||0)}))
    .filter(x=>x.g.score!=null).sort((a,b)=>parseFloat(b.g.score)-parseFloat(a.g.score));
  const bestDrafter=graded[0];
  const worstDrafter=graded[graded.length-1];

  // Biggest risers/fallers among drafted players
  const risers=[...withKtc].filter(p=>p.ktcTrend>0).sort((a,b)=>b.ktcTrend-a.ktcTrend).slice(0,5);
  const fallers=[...withKtc].filter(p=>p.ktcTrend<0).sort((a,b)=>a.ktcTrend-b.ktcTrend).slice(0,5);

  // Position breakdown
  const posCounts={};
  allRows.forEach(r=>{posCounts[r.position]=(posCounts[r.position]||0)+1;});

  // Total steals/reaches
  const stealsAll=withKtc.filter(p=>(p.pickNum-p.ktcRank)>=4).length;
  const reachesAll=withKtc.filter(p=>(p.pickNum-p.ktcRank)<=-5).length;

  const bsWd=bestSteal?weightedDelta(bestSteal):null;
  const brWd=biggestReach?weightedDelta(biggestReach):null;

  document.getElementById("main").innerHTML=`
    <div class="liga-overview">
      ${bestDrafter?`<div class="liga-card">
        <div class="liga-card-label">🏆 Bester Drafter</div>
        <div class="liga-card-val" style="color:var(--green)">${bestDrafter.name}</div>
        <div class="liga-card-sub">Score: ${bestDrafter.g.score} · Note: ${bestDrafter.g.grade}</div>
      </div>`:""}
      ${worstDrafter&&worstDrafter.name!==bestDrafter?.name?`<div class="liga-card">
        <div class="liga-card-label">📉 Schlechtester Drafter</div>
        <div class="liga-card-val" style="color:var(--red)">${worstDrafter.name}</div>
        <div class="liga-card-sub">Score: ${worstDrafter.g.score} · Note: ${worstDrafter.g.grade}</div>
      </div>`:""}
      ${bestSteal?`<div class="liga-card">
        <div class="liga-card-label">🔥 Größter Steal</div>
        <div class="liga-card-val" style="color:var(--green)">${bestSteal.fullName}</div>
        <div class="liga-card-sub">Pick #${bestSteal.pickNum} · KTC #${bestSteal.ktcRank} · Score ${bsWd>=0?"+":""}${bsWd?.toFixed(1)} · ${bestSteal.drafter}</div>
      </div>`:""}
      ${biggestReach?`<div class="liga-card">
        <div class="liga-card-label">❌ Größter Reach</div>
        <div class="liga-card-val" style="color:var(--red)">${biggestReach.fullName}</div>
        <div class="liga-card-sub">Pick #${biggestReach.pickNum} · KTC #${biggestReach.ktcRank} · Score ${brWd>=0?"+":""}${brWd?.toFixed(1)} · ${biggestReach.drafter}</div>
      </div>`:""}
      <div class="liga-card">
        <div class="liga-card-label">📊 Liga-Bilanz</div>
        <div class="liga-card-val">${stealsAll} Steals · ${reachesAll} Reaches</div>
        <div class="liga-card-sub">${allRows.length} Picks total</div>
      </div>
      <div class="liga-card">
        <div class="liga-card-label">🏈 Position-Mix</div>
        <div class="liga-card-val" style="font-size:13px;line-height:1.6">
          ${Object.entries(posCounts).sort((a,b)=>b[1]-a[1]).map(([p,c])=>`<span class="pos-badge ${p}" style="font-size:9px;padding:1px 7px;margin-right:4px">${p}</span>${c}`).join("  ")}
        </div>
      </div>
    </div>
    <div class="liga-divider"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 40px 60px">
      <div>
        <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:12px">📈 Größte Steiger (gedraftete Spieler · 30d)</div>
        ${risers.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-family:'Bebas Neue';font-size:18px;color:var(--dim);min-width:20px">${i+1}</span>
          <span style="flex:1;font-size:13px;font-weight:500">${p.fullName}</span>
          <span class="pos-badge ${p.position}" style="font-size:9px;padding:1px 6px">${p.position}</span>
          <span style="color:var(--green);font-weight:700;font-size:13px">▲${p.ktcTrend}</span>
          <span style="font-size:11px;color:var(--muted)">${p.drafter}</span>
        </div>`).join("")}
      </div>
      <div>
        <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:12px">📉 Größte Faller (gedraftete Spieler · 30d)</div>
        ${fallers.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-family:'Bebas Neue';font-size:18px;color:var(--dim);min-width:20px">${i+1}</span>
          <span style="flex:1;font-size:13px;font-weight:500">${p.fullName}</span>
          <span class="pos-badge ${p.position}" style="font-size:9px;padding:1px 6px">${p.position}</span>
          <span style="color:var(--red);font-weight:700;font-size:13px">▼${Math.abs(p.ktcTrend)}</span>
          <span style="font-size:11px;color:var(--muted)">${p.drafter}</span>
        </div>`).join("")}
      </div>
    </div>`;
}

// ── Theme ─────────────────────────────────────────────────────────────────────
function toggleTheme(){
  const html=document.documentElement;
  const dark=html.getAttribute("data-theme")==="dark";
  html.setAttribute("data-theme",dark?"light":"dark");
  document.getElementById("themeBtn").textContent=dark?"☀️":"🌙";
}

// ── Tab ───────────────────────────────────────────────────────────────────────
function switchTab(tab,btn){
  curTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  // Hide/show controls row — liga overview doesn't need pos filter
  document.querySelector(".controls").style.display=tab==="liga"?"none":"flex";
  if(allRows.length) renderView();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStep(msg){const el=document.getElementById("loadTxt");if(el)el.textContent=msg;}
function setBadge(state,msg){
  document.getElementById("badgeTxt").textContent=msg;
  const d=document.getElementById("dot");
  d.className="dot"+(state==="loading"?" loading":state==="error"?" error":"");
}

document.querySelectorAll(".fbtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    posFilter=btn.dataset.pos;
    document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    if(allRows.length)renderView();
  });
});
document.getElementById("searchInput").addEventListener("input",()=>{
  if(allRows.length)renderView();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
setBadge("loading","Laden…");
loadDraft().catch(err=>{
  document.getElementById("main").innerHTML=
    `<div class="err-box"><strong>Fehler:</strong> ${err.message}<br><br><small>Überprüfe die League ID und ob der Draft abgeschlossen ist.</small></div>`;
  setBadge("error","Fehler");
  console.error(err);
});
</script>
</body>
</html>
